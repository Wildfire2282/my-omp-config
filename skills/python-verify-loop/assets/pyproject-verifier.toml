# Merge these blocks into the project's pyproject.toml.
# Centralizes all verifier rules so the agent never decides code style itself.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    ".venv",
]
typeCheckingMode = "standard"
# Resolves `import myapp` for src-layout projects that are not installed.
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
]
# Lets pytest import the package under test in src-layout projects (pytest 7+).
pythonpath = ["src"]
